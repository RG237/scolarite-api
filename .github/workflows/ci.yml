name: CI scolarite-api (RG237)
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Message de depart
        run: echo "Pipeline TP2 de RG237 - branche ${{ github.ref_name }}"
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: scolarite-jar-rg237
          path: target/*.jar